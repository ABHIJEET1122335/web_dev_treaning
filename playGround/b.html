<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .chat-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 12px rgba(0,0,0,0.3);
            text-align: center;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-yes { background-color: #4CAF50; color: white; }
        .btn-yes:hover { background-color: #45a049; }
        .btn-no { background-color: #f44336; color: white; }
        .btn-no:hover { background-color: #da190b; }



    </style>
</head>
<body>

    <div class="chat-box">
        <h2 id="heading-message">Hi there, do you want to talk?</h2>
        <button type="button" class="btn-yes" onclick="sayYes()">YES</button>
        <button type="button" class="btn-no" onclick="sayNo()">NO</button>
    </div>
    <div class="po""></div>

    <script src="b.js">
        function sayYes() {
             document.getElementById("heading-message").innerHTML = "Thanks for talking to me!! 😊";
        }

        function sayNo() {
             document.getElementById("heading-message").innerHTML = "Ok then. See you when you really want to talk. 🙂";
        }
    </script>

</body>
</html>
