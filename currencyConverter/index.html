<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Currency Converter</title>
  </head>
  <body>
    <div class="converter">
      <h2>Currency Converter</h2>
      <form id="currency-form">
        <div class="amount">
          <label for="amount">Enter Amount</label>
          <input id="amount" type="number" value="100" placeholder="Enter amount" />
        </div>
        <div class="dropdown">
          <div class="from">
            <p>From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="USA Flag" />
              <select name="from" id="from-currency">
              </select>
            </div>
          </div>
          <div class="swap-icon">
            <i class="fas fa-exchange-alt"></i>
          </div>
          <div class="to">
            <p>To</p>
            <div class="select-container">
              <img src="https://flagsapi.com/BD/flat/64.png" alt="Bangladesh Flag" />
              <select name="to" id="to-currency">
              </select>
            </div>
          </div>
        </div>
        <div class="exchange-rate" id="exchange-rate"></div>
        <button type="submit">Get Exchange Rate</button>
      </form>
    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
